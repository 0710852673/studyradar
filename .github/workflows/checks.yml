name: Study Radar checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm install --no-audit --no-fund
      - run: bun test tests
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
